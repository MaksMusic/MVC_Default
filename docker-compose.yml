services:
  # БД доступна только внутри docker-сети; наружу порт 5432 НЕ публикуем.
  db:
    image: postgres:16-alpine
    container_name: mvc_default_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  app:
    build: .
    container_name: mvc_default_app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ВАЖНО: Папка logs на сервере будет синхронизирована с папкой /app/logs в контейнере
      - ./logs:/app/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8181:8080"
    restart: unless-stopped

volumes:
  pgdata: